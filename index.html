<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07080f">
    <title>Pont de Lumière</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #07080f;
            --surface:   #0e1018;
            --fr:        #2563eb;
            --fr-light:  #60a5fa;
            --fr-dim:    rgba(37,99,235,0.18);
            --vn:        #dc2626;
            --vn-light:  #f87171;
            --vn-dim:    rgba(220,38,38,0.18);
            --text:      #eef2ff;
            --muted:     rgba(238,242,255,0.4);
            --border:    rgba(255,255,255,0.07);
            --safe-t:    env(safe-area-inset-top, 0px);
            --safe-b:    env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Sélection de texte autorisée dans les bulles */
        .bubble {
            user-select: text !important;
            -webkit-user-select: text !important;
            cursor: text;
        }

        /* ══ AURORA BG ══ */
        .aurora {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .aurora-fr {
            position: absolute; bottom: -5%; left: -20%; width: 140%; height: 50%;
            background: radial-gradient(ellipse at 50% 100%, rgba(37,99,235,0.1) 0%, transparent 65%);
            animation: breathe 8s ease-in-out infinite;
        }
        .aurora-vn {
            position: absolute; top: -5%; left: -20%; width: 140%; height: 50%;
            background: radial-gradient(ellipse at 50% 0%, rgba(220,38,38,0.1) 0%, transparent 65%);
            animation: breathe 10s ease-in-out infinite reverse;
        }
        @keyframes breathe {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.07); opacity: 0.6; }
        }

        /* ══════════════════════════════════════
           ÉCRAN CLÉ API
        ══════════════════════════════════════ */
        #screen-key {
            position: fixed; inset: 0; z-index: 200;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: calc(40px + var(--safe-t)) 32px calc(40px + var(--safe-b));
            gap: 20px;
        }
        .key-gem {
            width: 10px; height: 10px;
            background: white; border-radius: 50%;
            box-shadow: 0 0 14px white, 0 0 36px rgba(255,255,255,0.5);
            animation: gem-pulse 3s ease-in-out infinite;
        }
        #screen-key h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem; font-weight: 400;
            letter-spacing: 4px; text-align: center;
        }
        #screen-key p {
            font-size: 0.85rem; color: var(--muted);
            text-align: center; line-height: 1.7;
            max-width: 280px;
        }
        #screen-key p a { color: var(--fr-light); text-decoration: none; }

        .key-input-wrap { width: 100%; max-width: 320px; position: relative; }
        #input-key {
            width: 100%; padding: 15px 50px 15px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
            outline: none; transition: border-color 0.3s;
            -webkit-user-select: text; user-select: text; touch-action: auto;
        }
        #input-key:focus { border-color: rgba(96,165,250,0.5); }
        #input-key::placeholder { color: rgba(238,242,255,0.22); font-size: 0.8rem; }

        .eye-btn {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 8px; color: var(--muted); touch-action: auto;
        }
        .eye-btn svg { width: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        #btn-save-key {
            width: 100%; max-width: 320px; padding: 16px;
            background: radial-gradient(circle at 40% 35%, #5b9cf6, #1d4ed8 60%, #1e3a8a);
            border: none; border-radius: 14px;
            color: white; font-family: 'Cinzel', serif;
            font-size: 0.85rem; letter-spacing: 2.5px;
            cursor: pointer; touch-action: auto;
            box-shadow: 0 0 28px rgba(37,99,235,0.45), 0 0 60px rgba(37,99,235,0.18);
            transition: transform 0.12s, box-shadow 0.3s;
        }
        #btn-save-key:active { transform: scale(0.96); }
        #key-error { font-size: 0.76rem; color: var(--vn-light); min-height: 18px; text-align: center; line-height: 1.5; }

        /* ══════════════════════════════════════
           APP PRINCIPALE
        ══════════════════════════════════════ */
        #app {
            display: none; flex-direction: column;
            height: 100%; position: relative; z-index: 1;
        }

        /* ══ HEADER ══ */
        .app-header {
            padding: calc(12px + var(--safe-t)) 20px 10px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0; background: rgba(7,8,15,0.8);
            backdrop-filter: blur(10px); z-index: 10;
        }
        .header-gem-wrap {
            display: flex; align-items: center; gap: 10px;
        }
        .header-gem {
            width: 7px; height: 7px; background: white; border-radius: 50%;
            box-shadow: 0 0 8px white, 0 0 20px rgba(255,255,255,0.5);
            animation: gem-pulse 3.2s ease-in-out infinite;
        }
        @keyframes gem-pulse {
            0%,100% { box-shadow: 0 0 8px white, 0 0 20px rgba(255,255,255,0.4); transform: scale(1); }
            50% { box-shadow: 0 0 14px white, 0 0 38px rgba(255,255,255,0.6); transform: scale(1.3); }
        }
        .header-title {
            font-family: 'Cinzel', serif; font-size: 0.72rem;
            letter-spacing: 3.5px; color: rgba(238,242,255,0.7);
        }
        .header-flags { font-size: 1.1rem; opacity: 0.6; }

        .reset-btn {
            background: none; border: none; color: var(--muted);
            font-family: 'Cinzel', serif; font-size: 0.48rem; letter-spacing: 2px;
            cursor: pointer; padding: 6px 10px; touch-action: auto;
            transition: color 0.3s;
        }
        .reset-btn:active { color: rgba(238,242,255,0.7); }

        /* Bouton poubelle central entre les deux micros */
        .clear-center {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 7px; flex-shrink: 0;
        }
        .clear-center-label {
            font-size: 0.50rem; letter-spacing: 1.5px;
            color: transparent; font-family: 'Cinzel', serif;
            transition: color 0.4s; text-transform: uppercase;
        }
        .clear-center.visible .clear-center-label { color: var(--muted); }

        .btn-clear-center {
            width: 54px; height: 54px; border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(238,242,255,0.28);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; touch-action: auto;
            transition: background 0.2s, color 0.2s, border-color 0.2s,
                        transform 0.15s, opacity 0.35s, box-shadow 0.2s;
            opacity: 0; pointer-events: none;
        }
        .btn-clear-center svg {
            width: 20px; height: 20px; fill: none;
            stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .clear-center.visible .btn-clear-center {
            opacity: 1; pointer-events: auto;
        }
        .btn-clear-center:active {
            transform: scale(0.87);
            background: rgba(220,38,38,0.14);
            border-color: rgba(220,38,38,0.4);
            color: var(--vn-light);
            box-shadow: 0 0 16px rgba(220,38,38,0.3);
        }
        .clear-status {
            font-size: 0.58rem; letter-spacing: 1px;
            color: transparent; min-height: 12px;
        }

        /* ══ CHAT ZONE ══ */
        #chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        #chat::-webkit-scrollbar { display: none; }

        /* Placeholder d'accueil */
        .chat-placeholder {
            margin: auto;
            text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }
        .chat-placeholder .big-flags { font-size: 2.8rem; opacity: 0.85; }
        .chat-placeholder p {
            font-size: 0.85rem; color: var(--muted); line-height: 1.7; max-width: 240px;
        }
        .chat-placeholder .hint {
            display: flex; gap: 10px; margin-top: 4px;
        }
        .hint-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 0.72rem;
            border: 1px solid; letter-spacing: 0.5px;
        }
        .hint-pill-fr {
            border-color: rgba(96,165,250,0.35); color: var(--fr-light);
            background: rgba(37,99,235,0.08);
        }
        .hint-pill-vn {
            border-color: rgba(248,113,113,0.35); color: var(--vn-light);
            background: rgba(220,38,38,0.08);
        }

        /* ══ BULLES ══ */
        .msg-group {
            display: flex; flex-direction: column; gap: 5px;
            animation: msg-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-group.fr { align-items: flex-end; }
        .msg-group.vn { align-items: flex-start; }

        .msg-label {
            font-size: 0.62rem; letter-spacing: 2px; color: var(--muted);
            padding: 0 4px; display: flex; align-items: center; gap: 5px;
        }

        .bubble {
            max-width: 82%;
            padding: 13px 16px;
            border-radius: 20px;
            line-height: 1.55;
            position: relative;
            word-break: break-word;
        }

        /* Bulle originale (transcription) */
        .bubble-original {
            font-size: 1.15rem;
            font-weight: 400;
        }
        .msg-group.fr .bubble-original {
            background: var(--fr);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 20px rgba(37,99,235,0.35);
        }
        .msg-group.vn .bubble-original {
            background: var(--vn);
            color: white;
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 20px rgba(220,38,38,0.35);
        }

        /* Bulle traduction */
        .bubble-translation {
            font-size: 1.35rem;
            font-weight: 500;
        }
        .msg-group.fr .bubble-translation {
            background: rgba(220,38,38,0.12);
            border: 1px solid rgba(220,38,38,0.22);
            color: var(--vn-light);
            border-bottom-left-radius: 6px;
            align-self: flex-start;
        }
        .msg-group.vn .bubble-translation {
            background: rgba(37,99,235,0.12);
            border: 1px solid rgba(37,99,235,0.22);
            color: var(--fr-light);
            border-bottom-right-radius: 6px;
            align-self: flex-end;
        }

        /* Bulle en cours (loading dots) */
        .bubble-loading {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex; gap: 5px; align-items: center;
            padding: 14px 18px;
        }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            animation: dot-bounce 1.2s ease-in-out infinite;
        }
        .msg-group.fr .dot { background: var(--fr-light); }
        .msg-group.vn .dot { background: var(--vn-light); }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* Bouton replay sur bulle traduction */
        .bubble-translation .replay-inline {
            display: inline-flex; align-items: center; justify-content: center;
            margin-left: 8px; vertical-align: middle;
            background: rgba(255,255,255,0.1); border: none;
            border-radius: 50%; width: 26px; height: 26px;
            cursor: pointer; opacity: 0.7; touch-action: auto;
            transition: opacity 0.2s, background 0.2s;
            color: currentColor;
        }
        .bubble-translation .replay-inline:active { opacity: 1; background: rgba(255,255,255,0.22); }
        .replay-inline svg { width: 14px; height: 14px; fill: currentColor; }

        /* ══ BARRE BASSE ══ */
        #controls {
            flex-shrink: 0;
            background: rgba(7,8,15,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 16px 20px calc(16px + var(--safe-b));
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .mic-btn-wrap {
            flex: 1;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .mic-label {
            font-size: 0.62rem; letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--muted); font-family: 'Cinzel', serif;
            transition: color 0.3s;
            display: flex; align-items: center; gap: 5px;
        }
        .mic-btn-wrap.recording .mic-label { color: rgba(238,242,255,0.85); }

        .btn-record {
            width: 76px; height: 76px;
            border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            position: relative; outline: none;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            transition: transform 0.12s ease, box-shadow 0.3s ease, opacity 0.3s;
            will-change: transform;
        }
        .btn-record:active { transform: scale(0.88); }

        .btn-fr {
            background: radial-gradient(circle at 38% 32%, #5b9cf6, #1d4ed8 60%, #1e3a8a);
            box-shadow: 0 0 22px rgba(37,99,235,0.55), 0 0 50px rgba(37,99,235,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-vn {
            background: radial-gradient(circle at 38% 32%, #f87171, #b91c1c 60%, #7f1d1d);
            box-shadow: 0 0 22px rgba(220,38,38,0.55), 0 0 50px rgba(220,38,38,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .mic-btn-wrap.recording .btn-fr {
            animation: orb-pulse-fr 1.5s ease-in-out infinite;
        }
        .mic-btn-wrap.recording .btn-vn {
            animation: orb-pulse-vn 1.5s ease-in-out infinite;
        }
        .mic-btn-wrap.processing .btn-record { opacity: 0.45; }

        @keyframes orb-pulse-fr {
            0%,100% { box-shadow: 0 0 28px rgba(37,99,235,0.7), 0 0 60px rgba(37,99,235,0.2), inset 0 1px 0 rgba(255,255,255,0.2); }
            50% { box-shadow: 0 0 50px rgba(37,99,235,1), 0 0 100px rgba(37,99,235,0.45), inset 0 1px 0 rgba(255,255,255,0.2); }
        }
        @keyframes orb-pulse-vn {
            0%,100% { box-shadow: 0 0 28px rgba(220,38,38,0.7), 0 0 60px rgba(220,38,38,0.2), inset 0 1px 0 rgba(255,255,255,0.2); }
            50% { box-shadow: 0 0 50px rgba(220,38,38,1), 0 0 100px rgba(220,38,38,0.45), inset 0 1px 0 rgba(255,255,255,0.2); }
        }

        /* Arc tournant autour du bouton */
        .btn-arc {
            position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid transparent; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; will-change: transform;
        }
        .btn-fr + .btn-arc { border-top-color: var(--fr-light); border-right-color: rgba(96,165,250,0.3); }
        .btn-vn + .btn-arc { border-top-color: var(--vn-light); border-right-color: rgba(248,113,113,0.3); }
        .mic-btn-wrap.recording .btn-arc { opacity: 1; animation: spin 1.1s linear infinite; }

        /* Ring processing */
        .btn-ring {
            position: absolute; inset: -10px; border-radius: 50%;
            border: 1.5px dashed transparent; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; will-change: transform;
        }
        .btn-fr ~ .btn-ring { border-color: rgba(96,165,250,0.5); }
        .btn-vn ~ .btn-ring { border-color: rgba(248,113,113,0.5); }
        .mic-btn-wrap.processing .btn-ring { opacity: 1; animation: spin 2s linear infinite; }
        .mic-btn-wrap.processing .btn-arc { opacity: 0 !important; animation: none !important; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .mic-icon { width: 26px; fill: white; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4)); pointer-events: none; }

        /* Status sous le bouton */
        .mic-status {
            font-size: 0.63rem; color: var(--muted);
            letter-spacing: 1.2px; font-style: italic;
            min-height: 16px; transition: color 0.3s;
            text-align: center;
        }
        .mic-btn-wrap.recording .mic-status { color: rgba(238,242,255,0.75); }

        /* Séparateur central */
        /* controls-divider replaced */

        /* ══ WAVEFORM ══ */
        .wave-canvas {
            width: 72px; height: 22px; display: block;
        }

        /* ══ TOAST ══ */
        #toast {
            position: fixed; bottom: calc(160px + var(--safe-b)); left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(30,30,40,0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; padding: 9px 18px;
            font-size: 0.75rem; color: var(--text); letter-spacing: 0.5px;
            z-index: 999; opacity: 0; transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; white-space: nowrap; max-width: 90vw;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Cursor typewriter */
        .tw-cursor {
            display: inline-block; width: 2px; height: 1.1em;
            background: currentColor; margin-left: 1px;
            vertical-align: middle; animation: blink 0.75s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="aurora">
    <div class="aurora-vn"></div>
    <div class="aurora-fr"></div>
</div>

<div id="toast"></div>

<!-- ══ ÉCRAN CLÉ API ══ -->
<div id="screen-key">
    <div class="key-gem"></div>
    <h1>PONT DE LUMIÈRE</h1>
    <p>Entre ta clé <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a> pour activer le traducteur.<br>Elle restera sur cet appareil uniquement.</p>
    <div class="key-input-wrap">
        <input id="input-key" type="password" placeholder="sk-or-v1-…" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="eye-btn" id="eye-btn" type="button">
            <svg id="eye-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </div>
    <button id="btn-save-key">ACTIVER</button>
    <div id="key-error"></div>
</div>

<!-- ══ APP ══ -->
<div id="app">

    <!-- Header -->
    <div class="app-header">
        <div class="header-gem-wrap">
            <div class="header-gem"></div>
            <span class="header-title">PONT DE LUMIÈRE</span>
        </div>
        <span class="header-flags">🇫🇷 · 🇻🇳</span>
        <button class="reset-btn" onclick="resetKey()">⚙ CLÉ</button>
    </div>

    <!-- Chat -->
    <div id="chat">
        <div class="chat-placeholder" id="placeholder">
            <div class="big-flags">🇫🇷 · 🇻🇳</div>
            <p>Appuie sur ton bouton et parle.<br>La traduction apparaîtra ici.</p>
            <div class="hint">
                <span class="hint-pill hint-pill-fr">🇫🇷 Maintenir</span>
                <span class="hint-pill hint-pill-vn">🇻🇳 Giữ</span>
            </div>
        </div>
    </div>

    <!-- Barre de contrôles fixe -->
    <div id="controls">

        <!-- FR -->
        <div class="mic-btn-wrap" id="wrap-fr">
            <span class="mic-label">🇫🇷 Français</span>
            <canvas class="wave-canvas" id="wave-fr" width="72" height="22"></canvas>
            <div style="position:relative; display:flex; align-items:center; justify-content:center;">
                <button class="btn-record btn-fr" id="btn-fr" aria-label="Parler en français">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div class="btn-arc"></div>
                <div class="btn-ring"></div>
            </div>
            <span class="mic-status" id="status-fr">Maintenir</span>
        </div>

        <!-- Poubelle centrale -->
        <div class="clear-center" id="clear-center-wrap">
            <div class="clear-center-label">clear</div>
            <button class="btn-clear-center" id="btn-clear" onclick="clearChat()" aria-label="Effacer la conversation">
                <svg viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                    <path d="M9 6V4h6v2"/>
                </svg>
            </button>
            <span class="clear-status"></span>
        </div>

        <!-- VN -->
        <div class="mic-btn-wrap" id="wrap-vn">
            <span class="mic-label">🇻🇳 Tiếng Việt</span>
            <canvas class="wave-canvas" id="wave-vn" width="72" height="22"></canvas>
            <div style="position:relative; display:flex; align-items:center; justify-content:center;">
                <button class="btn-record btn-vn" id="btn-vn" aria-label="Nói tiếng Việt">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div class="btn-arc"></div>
                <div class="btn-ring"></div>
            </div>
            <span class="mic-status" id="status-vn">Giữ để nói</span>
        </div>

    </div>
</div>

<script>
// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
const OR_URL    = "https://openrouter.ai/api/v1";
const MODEL_STT = "openai/whisper-large-v3-turbo";
const MODEL_TRL = "google/gemini-2.5-flash-lite";
const MODEL_TTS = "openai/gpt-4o-mini-tts-2025-12-15";
const LS_KEY    = "pontdelumiere_apikey";

let API_KEY      = "";
let lastAudio    = { fr: null, vn: null };
let currentAudio = null;

// ══ TOAST ══
let toastTimer = null;
function showToast(msg, ms = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ══════════════════════════════════════
//  CLÉ API
// ══════════════════════════════════════
function initApp() {
    const saved = localStorage.getItem(LS_KEY);
    if (saved && saved.startsWith("sk-or")) { API_KEY = saved; showApp(); }
    else showKeyScreen();
}

function showKeyScreen() {
    document.getElementById("screen-key").style.display = "flex";
    document.getElementById("app").style.display = "none";
}

async function showApp() {
    document.getElementById("screen-key").style.display = "none";
    document.getElementById("app").style.display = "flex";
    drawIdle('fr'); drawIdle('vn');
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        new Audio().play().catch(() => {});
    } catch(e) {
        showToast('⚠ Micro inaccessible — vérifie les permissions');
    }
}

function resetKey() {
    localStorage.removeItem(LS_KEY);
    API_KEY = "";
    document.getElementById("input-key").value = "";
    document.getElementById("key-error").textContent = "";
    showKeyScreen();
}

document.getElementById("btn-save-key").addEventListener("click", () => {
    const val = document.getElementById("input-key").value.trim();
    const errEl = document.getElementById("key-error");
    if (!val) { errEl.textContent = "⚠ Entre une clé pour continuer"; return; }
    if (!val.startsWith("sk-or")) {
        errEl.innerHTML = "⚠ Clé invalide — doit commencer par <strong>sk-or-…</strong>"; return;
    }
    API_KEY = val;
    try { localStorage.setItem(LS_KEY, val); } catch(_) {}
    showApp();
});

let keyVisible = false;
document.getElementById("eye-btn").addEventListener("click", () => {
    keyVisible = !keyVisible;
    document.getElementById("input-key").type = keyVisible ? "text" : "password";
    document.getElementById("eye-icon").innerHTML = keyVisible
        ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
});
document.getElementById("input-key").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("btn-save-key").click();
});

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let mediaRecorder   = null;
let audioChunks     = [];
let activeMode      = null;
let isButtonPressed = false;
let micStream       = null;
let audioCtx        = null;
let analyser        = null;
let rafId           = null;
const COLORS        = { fr: '#60a5fa', vn: '#f87171' };

// ══════════════════════════════════════
//  CHAT — BULLES
// ══════════════════════════════════════
let loadingGroup = null;

function removePlaceholder() {
    const p = document.getElementById('placeholder');
    if (p) {
        p.remove();
        const wrap = document.getElementById('clear-center-wrap');
        if (wrap) wrap.classList.add('visible');
    }
}

function addLoadingBubble(mode) {
    removePlaceholder();
    const chat = document.getElementById('chat');
    const grp = document.createElement('div');
    grp.className = `msg-group ${mode}`;
    grp.innerHTML = `
        <div class="msg-label">${mode === 'fr' ? '🇫🇷' : '🇻🇳'} <span>${mode === 'fr' ? '…enregistrement' : '…ghi âm'}</span></div>
        <div class="bubble bubble-original bubble-loading">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>`;
    chat.appendChild(grp);
    chat.scrollTop = chat.scrollHeight;
    loadingGroup = grp;
    return grp;
}

function updateLoadingLabel(mode, text) {
    if (!loadingGroup) return;
    const lbl = loadingGroup.querySelector('.msg-label span');
    if (lbl) lbl.textContent = text;
}

function finalizeGroup(mode, original, translation, audioData) {
    if (loadingGroup) { loadingGroup.remove(); loadingGroup = null; }
    const chat = document.getElementById('chat');

    // Créer le bouton replay
    const replayBtn = `
        <button class="replay-inline" data-lang="${mode === 'fr' ? 'vn' : 'fr'}" aria-label="Réécouter">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>`;

    const grp = document.createElement('div');
    grp.className = `msg-group ${mode}`;
    grp.innerHTML = `
        <div class="msg-label">${mode === 'fr' ? '🇫🇷 Français' : '🇻🇳 Tiếng Việt'}</div>
        <div class="bubble bubble-original">${escHtml(original)}</div>
        <div class="bubble bubble-translation" id="trans-bubble-${Date.now()}">
            <span class="trans-text">${escHtml(translation)}</span>${replayBtn}
        </div>`;

    chat.appendChild(grp);

    // Liaison replay
    const btn = grp.querySelector('.replay-inline');
    const tLang = mode === 'fr' ? 'vn' : 'fr';
    if (audioData) {
        btn.addEventListener('click', () => {
            if (currentAudio) currentAudio.pause();
            currentAudio = new Audio(audioData);
            currentAudio.play().catch(() => {});
        });
    } else {
        btn.style.display = 'none';
    }

    chat.scrollTop = chat.scrollHeight;
}

function addErrorBubble(mode, msg) {
    if (loadingGroup) { loadingGroup.remove(); loadingGroup = null; }
    const chat = document.getElementById('chat');
    const grp = document.createElement('div');
    grp.className = `msg-group ${mode}`;
    grp.innerHTML = `
        <div class="bubble bubble-original" style="background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);font-size:0.85rem;color:var(--vn-light)">
            ⚠ ${escHtml(msg)}
        </div>`;
    chat.appendChild(grp);
    chat.scrollTop = chat.scrollHeight;
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════
//  WAVEFORM
// ══════════════════════════════════════
function drawIdle(mode) {
    const canvas = document.getElementById(`wave-${mode}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    ctx.strokeStyle = COLORS[mode];
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.2;
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
}

function startWaveLoop(mode) {
    if (!analyser) return;
    analyser.fftSize = 64;
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const canvas = document.getElementById(`wave-${mode}`);
    const ctx = canvas.getContext('2d');
    const color = COLORS[mode];
    const W = canvas.width, H = canvas.height;
    function draw() {
        rafId = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(buf);
        ctx.clearRect(0, 0, W, H);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 8; ctx.shadowColor = color;
        const sl = W / buf.length;
        buf.forEach((v, i) => {
            const y = (v / 128) * (H / 2);
            i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sl, y);
        });
        ctx.lineTo(W, H/2); ctx.stroke(); ctx.shadowBlur = 0;
    }
    draw();
}

function stopWaveLoop(mode) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    drawIdle(mode);
}

// ══════════════════════════════════════
//  RECORDING
// ══════════════════════════════════════
const wrap = id => document.getElementById(`wrap-${id}`);
const setStatus = (id, txt) => { const el = document.getElementById(`status-${id}`); if(el) el.textContent = txt; };

async function startRecording(mode) {
    if (activeMode) return;
    isButtonPressed = true;
    activeMode = mode;

    wrap(mode).classList.add('recording');
    setStatus(mode, mode === 'fr' ? 'Initialisation…' : 'Đang khởi tạo…');

    if (!navigator.mediaDevices?.getUserMedia) {
        showToast('⚠ HTTPS requis pour le micro');
        wrap(mode).classList.remove('recording');
        activeMode = null; return;
    }

    try {
        if (!micStream || !micStream.active)
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        if (!isButtonPressed) { wrap(mode).classList.remove('recording'); activeMode = null; return; }
        if (navigator.vibrate) navigator.vibrate(35);
    } catch(e) {
        setStatus(mode, '⚠ Micro inaccessible');
        wrap(mode).classList.remove('recording');
        activeMode = null; return;
    }

    try {
        if (!audioCtx || audioCtx.state === 'closed')
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        analyser = audioCtx.createAnalyser();
        audioCtx.createMediaStreamSource(micStream).connect(analyser);
        startWaveLoop(mode);

        const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg','audio/wav'];
        const mtype = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
        mediaRecorder = new MediaRecorder(micStream, mtype ? { mimeType: mtype } : {});
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onerror = e => console.error("MR:", e.error);
        mediaRecorder.onstop = () => processAudio();
        mediaRecorder.start();

        addLoadingBubble(mode);
        setStatus(mode, mode === 'fr' ? 'Enregistrement…' : 'Đang ghi âm…');
    } catch(e) {
        setStatus(mode, '⚠ Erreur d\'init');
        wrap(mode).classList.remove('recording');
        activeMode = null;
    }
}

function stopRecording(mode) {
    if (activeMode !== mode) return;
    isButtonPressed = false;
    if (navigator.vibrate) navigator.vibrate(18);

    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        activeMode = null; stopWaveLoop(mode);
        wrap(mode).classList.remove('recording'); return;
    }
    mediaRecorder.stop();
    stopWaveLoop(mode);
    wrap(mode).classList.remove('recording');
    wrap(mode).classList.add('processing');
    setStatus(mode, mode === 'fr' ? 'Traduction…' : 'Đang dịch…');
    updateLoadingLabel(mode, mode === 'fr' ? '…traduction' : '…đang dịch');
}

// ══════════════════════════════════════
//  PIPELINE
// ══════════════════════════════════════
async function processAudio() {
    const mode = activeMode;
    if (!mode) return;
    const mimeType = mediaRecorder?.mimeType || 'audio/webm';
    const blob = new Blob(audioChunks, { type: mimeType });

    if (blob.size < 500) {
        addErrorBubble(mode, mode === 'fr' ? 'Trop court, réessaie' : 'Quá ngắn, thử lại');
        wrap(mode).classList.remove('processing');
        setStatus(mode, mode === 'fr' ? 'Maintenir' : 'Giữ để nói');
        activeMode = null; return;
    }

    let original = '', translation = '', audioData = null;
    const isFR = mode === 'fr';

    try {
        // ── ÉTAPE 1 : STT — on ne peut pas faire mieux, on doit attendre la transcription
        const base64Audio = await new Promise(resolve => {
            const r = new FileReader();
            r.onloadend = () => resolve(r.result.split(',')[1]);
            r.readAsDataURL(blob);
        });
        const ext = mimeType.split('/')[1].split(';')[0] || 'webm';

        const r1 = await fetch(`${OR_URL}/audio/transcriptions`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json',
                'HTTP-Referer': window.location.protocol === 'file:' ? 'https://localhost' : window.location.href,
                'X-Title': 'Pont de Lumière'
            },
            body: JSON.stringify({
                model: MODEL_STT,
                input_audio: { data: base64Audio, format: ext === 'mp4' ? 'm4a' : ext }
            })
        });
        if (!r1.ok) throw new Error(`Whisper ${r1.status}`);
        const { text: stt } = await r1.json();
        if (!stt?.trim()) throw new Error('Transcription vide');
        original = stt.trim();

        // ── ÉTAPE 2 : Traduction — on attend, puis on affiche IMMÉDIATEMENT
        const srcLang = isFR ? 'français' : 'vietnamien';
        const tgtLang = isFR ? 'vietnamien' : 'français';
        const ttsLang = isFR ? 'vn' : 'fr';

        const r2 = await fetch(`${OR_URL}/chat/completions`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json',
                'HTTP-Referer': window.location.protocol === 'file:' ? 'https://localhost' : window.location.href,
                'X-Title': 'Pont de Lumière'
            },
            body: JSON.stringify({
                model: MODEL_TRL,
                messages: [
                    {
                        role: 'system',
                        content: `Tu es un interprète expert ${srcLang}/${tgtLang}. Traduis vers le ${tgtLang}.
${isFR
    ? 'Utilise des pronoms vietnamiens naturels et polis (Anh/Chị/Em/Tôi) adaptés à un dialogue touriste-local.'
    : 'Formule une traduction naturelle et fluide en français courant.'}
Réponds UNIQUEMENT avec la traduction. Aucune explication. Aucun guillemet.`
                    },
                    { role: 'user', content: original }
                ]
            })
        });
        if (!r2.ok) throw new Error(`Gemini ${r2.status}`);
        const { choices } = await r2.json();
        translation = choices[0].message.content.trim();

        // ── ÉTAPE 3 : TTS en fire-and-forget — on N'attend PAS, l'audio arrive tout seul
        speakGetData(translation, ttsLang).then(data => {
            if (data) { lastAudio[ttsLang] = data; playAudio(data); }
            else {
                const u = new SpeechSynthesisUtterance(translation);
                u.lang = isFR ? 'vi-VN' : 'fr-FR';
                window.speechSynthesis.speak(u);
            }
        }).catch(() => {
            const u = new SpeechSynthesisUtterance(translation);
            u.lang = isFR ? 'vi-VN' : 'fr-FR';
            window.speechSynthesis.speak(u);
        });

    } catch(err) {
        console.error(err);
        addErrorBubble(mode, 'Erreur — vérifie ta clé API');
        wrap(mode).classList.remove('processing');
        setStatus(mode, mode === 'fr' ? 'Maintenir' : 'Giữ để nói');
        activeMode = null; return;
    }

    // Affichage immédiat — sans attendre le TTS
    finalizeGroup(mode, original, translation, null);
    wrap(mode).classList.remove('processing');
    setStatus(mode, isFR ? '✓ Traduit' : '✓ Đã dịch');
    setTimeout(() => setStatus(mode, isFR ? 'Maintenir' : 'Giữ để nói'), 3500);
    activeMode = null;
}

// ══════════════════════════════════════
//  TTS — retourne le dataUrl ou null
// ══════════════════════════════════════
async function speakGetData(text, lang) {
    if (!text) return null;
    try {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const res = await fetch(`${OR_URL}/audio/speech`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: MODEL_TTS, input: text, voice: lang === 'fr' ? 'onyx' : 'shimmer', response_format: 'mp3' })
        });
        if (!res.ok) return null;
        const buf = await res.arrayBuffer();
        if (buf.byteLength < 100) return null;
        const audioBlob = new Blob([buf], { type: 'audio/mpeg' });
        return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(audioBlob);
        });
    } catch(e) {
        return null;
    }
}

function playAudio(dataUrl) {
    if (!dataUrl) return;
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio(dataUrl);
    currentAudio.play().catch(() => {});
}

// ══════════════════════════════════════
//  EVENTS BOUTONS
// ══════════════════════════════════════
function bindBtn(btnId, mode) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('contextmenu', e => e.preventDefault());

    const onStart = e => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        e.preventDefault();
        startRecording(mode);
    };
    const onStop = e => { e.preventDefault(); stopRecording(mode); };

    btn.addEventListener('touchstart', onStart, { passive: false });
    btn.addEventListener('touchend', onStop, { passive: false });
    btn.addEventListener('touchcancel', onStop, { passive: false });
    btn.addEventListener('mousedown', onStart);
    btn.addEventListener('mouseup', onStop);
    btn.addEventListener('mouseleave', () => { if (activeMode === mode) stopRecording(mode); });
}

bindBtn('btn-fr', 'fr');
bindBtn('btn-vn', 'vn');

// ══════════════════════════════════════
//  CLEAR CONVERSATION
// ══════════════════════════════════════
function clearChat() {
    const chat = document.getElementById('chat');
    chat.innerHTML = `
        <div class="chat-placeholder" id="placeholder">
            <div class="big-flags">🇫🇷 · 🇻🇳</div>
            <p>Appuie sur ton bouton et parle.<br>La traduction apparaîtra ici.</p>
            <div class="hint">
                <span class="hint-pill hint-pill-fr">🇫🇷 Maintenir</span>
                <span class="hint-pill hint-pill-vn">🇻🇳 Giữ</span>
            </div>
        </div>`;
    lastAudio = { fr: null, vn: null };
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const wrap = document.getElementById('clear-center-wrap');
    if (wrap) wrap.classList.remove('visible');
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
initApp();
</script>
</body>
