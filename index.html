<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pont de Lumière</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #04060c;
            --fr: #2563eb;
            --fr-light: #60a5fa;
            --vn: #dc2626;
            --vn-light: #f87171;
            --text: #eef2ff;
            --muted: rgba(238, 242, 255, 0.38);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Noto Serif', serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ══ AURORA ══ */
        .aurora {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .aurora-fr {
            position: absolute;
            bottom: -10%;
            left: -20%;
            width: 140%;
            height: 60%;
            background: radial-gradient(ellipse at 50% 100%, rgba(37, 99, 235, 0.14) 0%, rgba(37, 99, 235, 0.06) 35%, transparent 65%);
            animation: breathe 7s ease-in-out infinite;
        }

        .aurora-vn {
            position: absolute;
            top: -10%;
            left: -20%;
            width: 140%;
            height: 60%;
            background: radial-gradient(ellipse at 50% 0%, rgba(220, 38, 38, 0.14) 0%, rgba(220, 38, 38, 0.06) 35%, transparent 65%);
            animation: breathe 9s ease-in-out infinite reverse;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.12);
                opacity: 0.65;
            }
        }

        /* ══ ÉCRAN CLÉ API ══ */
        #screen-key {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 28px;
            gap: 24px;
        }

        #screen-key .gem {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 16px white, 0 0 40px rgba(255, 255, 255, 0.5);
            animation: gem-pulse 3s ease-in-out infinite;
        }

        #screen-key h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-align: center;
            color: var(--text);
        }

        #screen-key p {
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
            font-weight: 300;
            max-width: 300px;
        }

        #screen-key p a {
            color: var(--fr-light);
            text-decoration: none;
        }

        .key-input-wrapper {
            width: 100%;
            max-width: 340px;
            position: relative;
        }

        #input-key {
            width: 100%;
            padding: 14px 48px 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Noto Serif', serif;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.3s;
            -webkit-user-select: text;
            user-select: text;
            touch-action: auto;
        }

        #input-key:focus {
            border-color: rgba(96, 165, 250, 0.5);
        }

        #input-key::placeholder {
            color: rgba(238, 242, 255, 0.2);
            font-size: 0.75rem;
        }

        /* Bouton œil pour voir/cacher */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--muted);
            touch-action: auto;
        }

        .eye-btn svg {
            width: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
        }

        #btn-save-key {
            width: 100%;
            max-width: 340px;
            padding: 15px;
            background: radial-gradient(circle at 40% 35%, #5b9cf6, #1d4ed8 60%, #1e3a8a);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(37, 99, 235, 0.5), 0 0 55px rgba(37, 99, 235, 0.2);
            transition: transform 0.15s, box-shadow 0.3s;
            touch-action: auto;
        }

        #btn-save-key:active {
            transform: scale(0.96);
        }

        #key-error {
            font-size: 0.75rem;
            color: var(--vn-light);
            min-height: 18px;
            text-align: center;
        }

        /* ══ APP PRINCIPALE ══ */
        #app {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        /* ══ PANELS ══ */
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            position: relative;
            z-index: 1;
            gap: 12px;
        }

        .panel-vn {
            transform: rotate(180deg);
        }

        .lang-label {
            position: absolute;
            top: 14px;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 7px;
            transition: color 0.3s;
        }

        .panel.recording .lang-label {
            color: rgba(238, 242, 255, 0.78);
        }

        /* Bouton reset clé */
        .reset-key-btn {
            position: absolute;
            bottom: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.48rem;
            letter-spacing: 2px;
            color: rgba(238, 242, 255, 0.15);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            touch-action: auto;
        }

        .reset-key-btn:active {
            color: rgba(238, 242, 255, 0.5);
        }

        /* ══ TEXT ══ */
        .display-area {
            text-align: center;
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: 300;
            line-height: 1.6;
            max-width: 88%;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            transition: opacity 0.22s ease;
        }

        .display-area.dimmed {
            opacity: 0;
        }

        .tw-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: currentColor;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ══ WAVEFORM ══ */
        .wave-canvas {
            display: block;
            width: 220px;
            height: 40px;
        }

        /* ══ ORB ══ */
        .orb-wrapper {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .halo {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: opacity 0.3s;
        }

        .halo-1 {
            inset: -12px;
            opacity: 0.25;
        }

        .halo-2 {
            inset: -22px;
            opacity: 0.12;
        }

        .panel-fr .halo {
            border-color: var(--fr-light);
        }

        .panel-vn .halo {
            border-color: var(--vn-light);
        }

        .arc {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .panel-fr .arc {
            border-top-color: var(--fr-light);
            border-right-color: rgba(96, 165, 250, 0.3);
        }

        .panel-vn .arc {
            border-top-color: var(--vn-light);
            border-right-color: rgba(248, 113, 113, 0.3);
        }

        .panel.recording .arc {
            opacity: 1;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .panel.recording .halo-1 {
            opacity: 0.55;
            animation: halo-pulse 1.8s ease-in-out infinite;
        }

        .panel.recording .halo-2 {
            opacity: 0.28;
            animation: halo-pulse 1.8s ease-in-out infinite 0.3s;
        }

        @keyframes halo-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        .btn-record {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.3s ease;
            outline: none;
            touch-action: manipulation;
        }

        .btn-record:active {
            transform: scale(0.91);
        }

        .btn-fr {
            background: radial-gradient(circle at 38% 32%, #5b9cf6, #1d4ed8 60%, #1e3a8a);
            box-shadow: 0 0 24px rgba(37, 99, 235, 0.6), 0 0 55px rgba(37, 99, 235, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-vn {
            background: radial-gradient(circle at 38% 32%, #f87171, #b91c1c 60%, #7f1d1d);
            box-shadow: 0 0 24px rgba(220, 38, 38, 0.6), 0 0 55px rgba(220, 38, 38, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .panel-fr.recording .btn-fr {
            animation: orb-pulse-fr 1.6s ease-in-out infinite;
        }

        .panel-vn.recording .btn-vn {
            animation: orb-pulse-vn 1.6s ease-in-out infinite;
        }

        @keyframes orb-pulse-fr {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(37, 99, 235, 0.7), 0 0 70px rgba(37, 99, 235, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 52px rgba(37, 99, 235, 1.0), 0 0 110px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
        }

        @keyframes orb-pulse-vn {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(220, 38, 38, 0.7), 0 0 70px rgba(220, 38, 38, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 52px rgba(220, 38, 38, 1.0), 0 0 110px rgba(220, 38, 38, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
        }

        .mic-icon {
            width: 28px;
            fill: white;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
            pointer-events: none;
        }

        .processing-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1.5px dashed transparent;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 3;
        }

        .panel-fr .processing-ring {
            border-color: rgba(96, 165, 250, 0.55);
        }

        .panel-vn .processing-ring {
            border-color: rgba(248, 113, 113, 0.55);
        }

        .panel.processing .processing-ring {
            opacity: 1;
            animation: spin 2.2s linear infinite;
        }

        .panel.processing .btn-record {
            opacity: 0.55;
        }

        .panel.processing .arc {
            opacity: 0 !important;
            animation: none !important;
        }

        .status {
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 1.5px;
            min-height: 18px;
            font-style: italic;
            transition: color 0.3s;
        }

        .panel.recording .status {
            color: rgba(238, 242, 255, 0.72);
        }

        /* ══ DIVIDER ══ */
        .divider {
            height: 1px;
            width: 100%;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .divider-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.06) 20%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.06) 80%, transparent 100%);
        }

        .divider-gem {
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 22px rgba(255, 255, 255, 0.4);
            animation: gem-pulse 3.2s ease-in-out infinite;
        }

        @keyframes gem-pulse {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 22px rgba(255, 255, 255, 0.4);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 16px white, 0 0 40px rgba(255, 255, 255, 0.65);
                transform: scale(1.35);
            }
        }

        /* ══ DEBUG CONSOLE ══ */
        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 120px;
            background: rgba(0, 0, 0, 0.85);
            color: #10b981;
            font-family: monospace;
            font-size: 10px;
            padding: 8px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            pointer-events: none;
            border-top: 1px solid #10b981;
        }
    </style>
</head>

<body>

    <div class="aurora">
        <div class="aurora-vn"></div>
        <div class="aurora-fr"></div>
    </div>

    <div id="debug-console"></div>

    <!-- ══ ÉCRAN SAISIE CLÉ API ══ -->
    <div id="screen-key">
        <div class="gem"></div>
        <h1>PONT DE LUMIÈRE</h1>
        <p>Entre ta clé API <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a> pour activer le
            traducteur.<br>Elle sera sauvegardée sur cet appareil uniquement.</p>

        <div class="key-input-wrapper">
            <input id="input-key" type="password" placeholder="sk-or-v1-..." autocomplete="off" autocorrect="off"
                spellcheck="false" />
            <button class="eye-btn" id="eye-btn" type="button">
                <svg id="eye-icon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>

        <button id="btn-save-key">ACTIVER</button>
        <div id="key-error"></div>
    </div>

    <!-- ══ APP PRINCIPALE ══ -->
    <div id="app">

        <!-- PANNEAU VN (haut, retourné) -->
        <div class="panel panel-vn" id="panel-vn">
            <div class="lang-label">🇻🇳 &nbsp;Tiếng Việt</div>
            <div class="display-area" id="text-vn">Nhấn giữ để nói</div>
            <canvas class="wave-canvas" id="wave-vn" width="220" height="40"></canvas>
            <div class="orb-wrapper">
                <div class="halo halo-2"></div>
                <div class="halo halo-1"></div>
                <div class="arc"></div>
                <button class="btn-record btn-vn" id="btn-vn">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>
                <div class="processing-ring"></div>
            </div>
            <div class="status" id="status-vn">Giữ để nói</div>
            <button class="reset-key-btn" onclick="resetKey()">⚙ CLÉ API</button>
        </div>

        <!-- DIVIDER -->
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-gem"></div>
        </div>

        <!-- PANNEAU FR (bas) -->
        <div class="panel panel-fr" id="panel-fr">
            <div class="lang-label">🇫🇷 &nbsp;Français</div>
            <div class="display-area" id="text-fr">Maintenir pour parler</div>
            <canvas class="wave-canvas" id="wave-fr" width="220" height="40"></canvas>
            <div class="orb-wrapper">
                <div class="halo halo-2"></div>
                <div class="halo halo-1"></div>
                <div class="arc"></div>
                <button class="btn-record btn-fr" id="btn-fr">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>
                <div class="processing-ring"></div>
            </div>
            <div class="status" id="status-fr">Maintenir pour parler</div>
            <button class="reset-key-btn" onclick="resetKey()">⚙ CLÉ API</button>
            <button class="reset-key-btn" style="right: 20px; left: auto;" onclick="testAPI()">🧪 TEST API</button>
        </div>

    </div>

    <script>
        // ══ DEBUG LOGGER ══
        function log(msg, isErr = false) {
            const consoleEl = document.getElementById('debug-console');
            consoleEl.style.display = 'block';
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            if (isErr) div.style.color = '#f87171';
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(msg);
        }
        window.onerror = (m, s, l, c, e) => log(`${m} (${l}:${c})`, true);

        if (!window.isSecureContext) {
            setTimeout(() => log("ATTENTION: Contexte non sécurisé (Besoin de HTTPS ou localhost)", true), 1000);
        }

        // ══════════════════════════════════════
        //  CONFIG
        // ══════════════════════════════════════
        const OR_URL = "https://openrouter.ai/api/v1";
        const MODEL_STT = "openai/whisper-large-v3-turbo";
        const MODEL_TRL = "google/gemini-2.5-flash-lite";
        const LS_KEY = "pontdelumiere_apikey";

        let API_KEY = "";

        // ══════════════════════════════════════
        //  GESTION CLÉ API
        // ══════════════════════════════════════
        function initApp() {
            const saved = localStorage.getItem(LS_KEY);
            if (saved && saved.startsWith("sk-or")) {
                API_KEY = saved;
                showApp();
            } else {
                showKeyScreen();
            }
        }

        function showKeyScreen() {
            document.getElementById("screen-key").style.display = "flex";
            document.getElementById("app").style.display = "none";
        }

        function showApp() {
            document.getElementById("screen-key").style.display = "none";
            document.getElementById("app").style.display = "flex";
            drawIdle('fr');
            drawIdle('vn');
        }

        function resetKey() {
            localStorage.removeItem(LS_KEY);
            API_KEY = "";
            document.getElementById("input-key").value = "";
            document.getElementById("key-error").textContent = "";
            showKeyScreen();
        }

        // Bouton sauvegarder clé
        document.getElementById("btn-save-key").addEventListener("click", () => {
            const val = document.getElementById("input-key").value.trim();
            const errEl = document.getElementById("key-error");
            
            if (!val) {
                errEl.textContent = "⚠ Entre une clé pour continuer";
                return;
            }
            
            if (!val.startsWith("sk-or")) {
                errEl.innerHTML = "⚠ Cette clé n'est pas une clé OpenRouter.<br>Elle doit commencer par <strong>sk-or-...</strong>";
                errEl.style.color = "#f87171";
                return;
            }
            
            API_KEY = val;
            try {
                localStorage.setItem(LS_KEY, val);
                showApp();
            } catch (e) {
                // Si localStorage est bloqué (mode privé strict), on laisse quand même l'app se lancer pour la session
                showApp();
            }
        });

        // Bouton œil — voir/cacher la clé
        let keyVisible = false;
        document.getElementById("eye-btn").addEventListener("click", () => {
            keyVisible = !keyVisible;
            document.getElementById("input-key").type = keyVisible ? "text" : "password";
            document.getElementById("eye-icon").innerHTML = keyVisible
                ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        });

        // Valider avec Entrée
        document.getElementById("input-key").addEventListener("keydown", e => {
            if (e.key === "Enter") document.getElementById("btn-save-key").click();
        });

        // ══════════════════════════════════════
        //  STATE
        // ══════════════════════════════════════
        let mediaRecorder = null;
        let audioChunks = [];
        let activeMode = null;
        let isButtonPressed = false; // Suivi de l'état du bouton
        let micStream = null;
        let audioCtx = null;
        let analyser = null;
        let rafId = null;

        const COLORS = { fr: '#60a5fa', vn: '#f87171' };

        // ══════════════════════════════════════
        //  WAVEFORM
        // ══════════════════════════════════════
        function drawIdle(mode) {
            const canvas = document.getElementById(`wave-${mode}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = COLORS[mode];
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.22;
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        function startWaveLoop(mode) {
            if (!analyser) return;
            analyser.fftSize = 128;
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const canvas = document.getElementById(`wave-${mode}`);
            const ctx = canvas.getContext('2d');
            const color = COLORS[mode];
            const W = canvas.width, H = canvas.height;

            function draw() {
                rafId = requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(buf);
                ctx.clearRect(0, 0, W, H);

                const grad = ctx.createLinearGradient(0, 0, W, 0);
                grad.addColorStop(0, 'transparent');
                grad.addColorStop(0.12, color);
                grad.addColorStop(0.88, color);
                grad.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2.2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = color;

                const slice = W / buf.length;
                buf.forEach((v, i) => {
                    const y = (v / 128.0) * (H / 2);
                    i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
                });
                ctx.lineTo(W, H / 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            draw();
        }

        function stopWaveLoop(mode) {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            drawIdle(mode);
        }

        // ══════════════════════════════════════
        //  RECORDING
        // ══════════════════════════════════════
        async function startRecording(mode) {
            if (activeMode) return;
            isButtonPressed = true;
            activeMode = mode;

            // Feedback immédiat pour rassurer l'utilisateur
            setStatus(mode, mode === 'fr' ? 'Initialisation...' : 'Đang khởi tạo...');
            panel(mode).classList.add('recording');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus(mode, '⚠ Navigateur non supporté ou non sécurisé (besoin de HTTPS)');
                panel(mode).classList.remove('recording');
                activeMode = null;
                return;
            }

            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Si l'utilisateur a déjà relâché le bouton pendant l'attente du micro
                if (!isButtonPressed) {
                    micStream.getTracks().forEach(t => t.stop());
                    panel(mode).classList.remove('recording');
                    activeMode = null;
                    return;
                }

                // Vibration Android si supportée
                if (navigator.vibrate) navigator.vibrate(40);
                log("Micro activé");
            } catch (err) {
                log("Erreur micro: " + err.message, true);
                setStatus(mode, '⚠ Micro inaccessible');
                panel(mode).classList.remove('recording');
                activeMode = null;
                return;
            }

            try {
                if (!audioCtx || audioCtx.state === 'closed') {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                log("AudioContext: " + audioCtx.state);

                analyser = audioCtx.createAnalyser();
                audioCtx.createMediaStreamSource(micStream).connect(analyser);
                startWaveLoop(mode);

                // Détection du format supporté (ordre de préférence pour Android/iOS)
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg', 'audio/wav'];
                const supportedType = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
                
                mediaRecorder = new MediaRecorder(micStream, supportedType ? { mimeType: supportedType } : {});
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onerror = e => console.error("Erreur MediaRecorder:", e.error);
                mediaRecorder.onstop = () => {
                    log("Recording stop");
                    if (micStream) micStream.getTracks().forEach(t => t.stop());
                    processAudio();
                };
                
                mediaRecorder.start();
                log("MediaRecorder démarré (" + supportedType + ")");

                panel(mode).classList.add('recording');
                setStatus(mode, mode === 'fr' ? 'Enregistrement...' : 'Đang ghi âm...');
            } catch (err) {
                console.error("Erreur démarrage MediaRecorder:", err);
                setStatus(mode, '⚠ Erreur d\'initialisation');
                panel(mode).classList.remove('recording');
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                activeMode = null;
            }
        }

        function stopRecording(mode) {
            if (activeMode !== mode) return;
            isButtonPressed = false;
            log("Relâchement bouton");
            
            if (navigator.vibrate) navigator.vibrate(20);

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                log("Recorder inactif, arrêt manuel");
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                activeMode = null;
                stopWaveLoop(mode);
                panel(mode).classList.remove('recording');
                return;
            }

            mediaRecorder.stop();
            stopWaveLoop(mode);
            panel(mode).classList.remove('recording');
            panel(mode).classList.add('processing');
            setStatus(mode, mode === 'fr' ? 'Traduction...' : 'Đang dịch...');
        }

        // ══════════════════════════════════════
        //  PIPELINE : Whisper → Gemini Flash-Lite
        // ══════════════════════════════════════
        async function processAudio() {
            const mode = activeMode;
            if (!mode) return;
            const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'audio/webm';
            const blob = new Blob(audioChunks, { type: mimeType });
            
            log(`Audio: ${blob.size} bytes, ${mimeType}`);

            if (blob.size < 500) {
                log("Audio trop court", true);
                setStatus(mode, mode === 'fr' ? 'Trop court, réessaie' : 'Quá ngắn, thử lại');
                panel(mode).classList.remove('processing');
                resetStatus(3000);
                activeMode = null;
                return;
            }

            try {
                // ÉTAPE 1 — Whisper STT via OpenRouter
                const reader = new FileReader();
                const base64Promise = new Promise(resolve => {
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
                const base64Audio = await base64Promise;
                const ext = mimeType.split('/')[1].split(';')[0] || 'webm';

                const r1 = await fetch(`${OR_URL}/audio/transcriptions`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.protocol === 'file:' ? 'https://localhost' : window.location.href,
                        'X-Title': 'Pont de Lumière'
                    },
                    body: JSON.stringify({
                        model: MODEL_STT,
                        input_audio: {
                            data: base64Audio,
                            format: ext === 'mp4' ? 'm4a' : ext // OpenRouter préfère m4a pour mp4 audio
                        }
                    })
                });
                if (!r1.ok) {
                    const errorText = await r1.text();
                    throw new Error(`Whisper ${r1.status}: ${errorText}`);
                }
                const { text: stt } = await r1.json();
                if (!stt || !stt.trim()) throw new Error('Transcription vide');

                fadeText(`text-${mode}`, stt);

                // ÉTAPE 2 — Gemini 2.5 Flash-Lite
                const isFR = mode === 'fr';
                const srcLang = isFR ? 'français' : 'vietnamien';
                const tgtLang = isFR ? 'vietnamien' : 'français';

                const r2 = await fetch(`${OR_URL}/chat/completions`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${API_KEY}`, 
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Pont de Lumière'
                    },
                    body: JSON.stringify({
                        model: MODEL_TRL,
                        messages: [
                            {
                                role: 'system',
                                content: `Tu es un interprète expert ${srcLang}/${tgtLang}. Traduis vers le ${tgtLang}.
${isFR
                                        ? 'Utilise des pronoms vietnamiens naturels et polis (Anh/Chị/Em/Tôi) adaptés à un dialogue touriste-local.'
                                        : 'Formule une traduction naturelle et fluide en français courant.'}
Réponds UNIQUEMENT avec la traduction. Aucune explication. Aucun guillemet.`
                            },
                            { role: 'user', content: stt }
                        ]
                    })
                });
                if (!r2.ok) throw new Error(`Gemini ${r2.status}`);
                const { choices } = await r2.json();
                const translation = choices[0].message.content.trim();

                // ÉTAPE 3 — Affichage + voix
                typewriter(isFR ? 'text-vn' : 'text-fr', translation);
                speak(translation, isFR ? 'vi-VN' : 'fr-FR');

                setStatus(mode, isFR ? '✓ Traduit' : '✓ Đã dịch');
                setStatus(isFR ? 'vn' : 'fr', isFR ? '◀ Traduction reçue' : '◀ Bản dịch nhận được');

            } catch (err) {
                console.error(err);
                setStatus(mode, '⚠ Erreur — vérifie ta clé API');
            } finally {
                panel(mode).classList.remove('processing');
                activeMode = null;
                resetStatus(3800);
            }
        }

        async function testAPI() {
            log("Test de connexion OpenRouter...");
            try {
                const r = await fetch(`${OR_URL}/chat/completions`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${API_KEY}`, 
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.protocol === 'file:' ? 'https://localhost' : window.location.href,
                        'X-Title': 'Pont de Lumière'
                    },
                    body: JSON.stringify({
                        model: MODEL_TRL,
                        messages: [{ role: 'user', content: 'Say hello' }]
                    })
                });
                if (r.ok) {
                    log("✓ Connexion API OK !");
                    alert("✓ Connexion OpenRouter réussie !");
                } else {
                    const txt = await r.text();
                    log("✖ Erreur API: " + r.status, true);
                    alert("✖ Erreur OpenRouter : " + txt);
                }
            } catch (err) {
                log("✖ Erreur réseau: " + err.message, true);
                alert("✖ Erreur réseau : " + err.message);
            }
        }

        // ══════════════════════════════════════
        //  SYNTHÈSE VOCALE
        // ══════════════════════════════════════
        function speak(text, lang) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.rate = 0.93;
            window.speechSynthesis.speak(u);
        }

        // ══════════════════════════════════════
        //  ANIMATIONS TEXTE
        // ══════════════════════════════════════
        function fadeText(id, text) {
            const el = document.getElementById(id);
            el.classList.add('dimmed');
            setTimeout(() => { el.textContent = text; el.classList.remove('dimmed'); }, 230);
        }

        function typewriter(id, text) {
            const el = document.getElementById(id);
            el.classList.add('dimmed');
            setTimeout(() => {
                el.innerHTML = '';
                el.classList.remove('dimmed');
                const cursor = document.createElement('span');
                cursor.className = 'tw-cursor';
                el.appendChild(cursor);
                let i = 0;
                const tick = setInterval(() => {
                    if (i < text.length) {
                        el.insertBefore(document.createTextNode(text[i++]), cursor);
                    } else {
                        clearInterval(tick);
                        setTimeout(() => cursor.remove(), 900);
                    }
                }, 26);
            }, 230);
        }

        // ══════════════════════════════════════
        //  HELPERS
        // ══════════════════════════════════════
        const panel = id => document.getElementById(`panel-${id}`);
        const setStatus = (id, txt) => { const el = document.getElementById(`status-${id}`); if (el) el.textContent = txt; };

        function resetStatus(delay) {
            setTimeout(() => {
                setStatus('fr', 'Maintenir pour parler');
                setStatus('vn', 'Giữ để nói');
            }, delay);
        }

        // ══════════════════════════════════════
        //  EVENTS BOUTONS MICRO
        // ══════════════════════════════════════
        function bindBtn(btnId, mode) {
            const btn = document.getElementById(btnId);
            
            // Empêche le menu contextuel (clic droit / appui long) sur Android
            btn.addEventListener('contextmenu', e => e.preventDefault());

            btn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(mode); }, { passive: false });
            btn.addEventListener('touchend', e => { e.preventDefault(); stopRecording(mode); }, { passive: false });
            btn.addEventListener('touchcancel', e => { e.preventDefault(); stopRecording(mode); }, { passive: false });
            
            btn.addEventListener('mousedown', e => { if (e.button === 0) startRecording(mode); });
            btn.addEventListener('mouseup', e => { if (e.button === 0) stopRecording(mode); });
            btn.addEventListener('mouseleave', () => { if (activeMode === mode) stopRecording(mode); });
        }

        bindBtn('btn-fr', 'fr');
        bindBtn('btn-vn', 'vn');

        // ══════════════════════════════════════
        //  INIT
        // ══════════════════════════════════════
        initApp();
    </script>
</body>
